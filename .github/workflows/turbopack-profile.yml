name: Turbopack profile

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/turbopack-profile.yml"
      - "bindings/devup-ui-wasm/**"
      - "libs/**"
      - "packages/next-plugin/**"
      - "packages/plugin-utils/**"
      - "packages/react/**"
      - "benchmark/next-devup-ui-single-turbo/**"
      - "benchmark/next-tailwind-turbo/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
        name: Install Bun

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build benchmark dependencies
        run: |
          bun run --filter @devup-ui/wasm --filter @devup-ui/plugin-utils build
          bun run --filter @devup-ui/react --filter @devup-ui/webpack-plugin build
          bun run --filter @devup-ui/next-plugin build

      - name: Compare cold Turbopack builds
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail

          devup_dir="$GITHUB_WORKSPACE/benchmark/next-devup-ui-single-turbo"
          tailwind_dir="$GITHUB_WORKSPACE/benchmark/next-tailwind-turbo"
          result_dir="$RUNNER_TEMP/turbopack-profile"
          mkdir -p "$result_dir/logs"

          run_build() {
            local name="$1"
            local directory="$2"
            local sample="$3"
            local record="$4"
            local started_at
            local finished_at
            local elapsed_ms
            local status

            rm -rf "$directory/.next" "$directory/df"
            started_at="$(date +%s%N)"
            set +e
            (cd "$directory" && bunx next build) 2>&1 \
              | tee "$result_dir/logs/${name}-${sample}.log"
            status="${PIPESTATUS[0]}"
            set -e
            finished_at="$(date +%s%N)"
            elapsed_ms="$(((finished_at - started_at) / 1000000))"

            echo "$name $sample: ${elapsed_ms}ms"
            if [[ "$status" -ne 0 ]]; then
              return "$status"
            fi
            if [[ "$record" == "true" ]]; then
              echo "$elapsed_ms" >> "$result_dir/${name}.txt"
            fi
          }

          # Warm both dependency graphs before recording. Each measured sample
          # still removes all application build outputs, so it is a cold Next
          # build with a balanced OS/module cache.
          run_build tailwind "$tailwind_dir" warmup false
          run_build devup "$devup_dir" warmup false

          # Alternate order to balance runner drift and first/second-run bias.
          for round in $(seq 1 7); do
            if ((round % 2 == 1)); then
              run_build devup "$devup_dir" "$round" true
              run_build tailwind "$tailwind_dir" "$round" true
            else
              run_build tailwind "$tailwind_dir" "$round" true
              run_build devup "$devup_dir" "$round" true
            fi
          done

          devup_median="$(sort -n "$result_dir/devup.txt" | sed -n '4p')"
          tailwind_median="$(sort -n "$result_dir/tailwind.txt" | sed -n '4p')"
          delta_ms="$((tailwind_median - devup_median))"
          delta_percent="$(awk -v d="$devup_median" -v t="$tailwind_median" \
            'BEGIN { printf "%.1f", ((t - d) / t) * 100 }')"
          devup_samples="$(awk 'BEGIN { ORS="" } { if (NR > 1) printf ", "; printf "%s", $0 }' "$result_dir/devup.txt")"
          tailwind_samples="$(awk 'BEGIN { ORS="" } { if (NR > 1) printf ", "; printf "%s", $0 }' "$result_dir/tailwind.txt")"

          {
            echo "### Turbopack cold-build comparison"
            echo
            echo "The comparison excludes Next's experimental memory-debug mode."
            echo "Both apps receive one unrecorded warmup, then seven output-cleaned builds in alternating order."
            echo
            echo "| App | Median | Samples (ms) |"
            echo "| --- | ---: | --- |"
            echo "| Devup UI singleCss | ${devup_median}ms | ${devup_samples} |"
            echo "| Tailwind Turbo | ${tailwind_median}ms | ${tailwind_samples} |"
            echo
            echo "Tailwind minus Devup UI: ${delta_ms}ms (${delta_percent}%)."
          } | tee "$result_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: turbopack-profile
          path: ${{ runner.temp }}/turbopack-profile/
          retention-days: 7
