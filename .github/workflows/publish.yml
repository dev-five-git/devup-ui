name: Publish Package to npm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feat/napi-binding
      - feat/react-native-metro
      - feat/react-native-themes
      - feat/react-native-responsive
      - feat/react-native-pressed
      - feat/react-native-css

# Pull requests and every job below run read-only. Only the `release` and
# `deploy-pages` jobs get write permissions, and they run on pushes to main
# alone, so no step a pull request controls can publish, tag, comment or deploy.
permissions:
  contents: read

# CI always runs the latest releases: the `ubuntu-latest` runner, the newest
# major version of every action, and the latest stable Rust, Bun, Node.js,
# wasm-pack, cargo-binstall, cargo-tarpaulin and changepacks. The one
# exception is the Rust release coverage is measured with, below.

# A new push to a pull request cancels the run it supersedes. Pushes to main
# are never cancelled: they release, deploy the site and record the benchmark.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Independent read-only lane; no existing validation job waits on it.
  native-build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: linux-x64-gnu, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { suffix: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, runner: ubuntu-latest }
          - { suffix: linux-x64-musl, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { suffix: linux-arm64-musl, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { suffix: darwin-x64, target: x86_64-apple-darwin, runner: macos-latest }
          - { suffix: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { suffix: win32-x64-msvc, target: x86_64-pc-windows-msvc, runner: windows-latest }
          # Windows ARM has no -latest alias; this is its newest exposed image, not a pin.
          - { suffix: win32-arm64-msvc, target: aarch64-pc-windows-msvc, runner: windows-11-vs2026-arm }
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Start durable build evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-build-${{ matrix.suffix }}"
          printf '%s\n' "$GITHUB_SHA $RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion" > "$RUNNER_TEMP/native-build-${{ matrix.suffix }}/runner.txt"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
      - name: Install latest stable Zig and cargo-zigbuild
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          version=$(jq -r 'keys[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$RUNNER_TEMP/zig-index.json" | sort -V | tail -1)
          jq --arg v "$version" '.[$v]["x86_64-linux"]' "$RUNNER_TEMP/zig-index.json" > "$RUNNER_TEMP/zig-asset.json"
          cp "$RUNNER_TEMP/zig-asset.json" "$RUNNER_TEMP/native-build-${{ matrix.suffix }}/zig-asset.json"
          curl -fsSL "$(jq -r .tarball "$RUNNER_TEMP/zig-asset.json")" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$(jq -r .shasum "$RUNNER_TEMP/zig-asset.json")  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-zigbuild-tool-target" cargo install cargo-zigbuild --locked --jobs 2
      - name: Build fresh target and retain exact receipt
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/native-target-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suffix }}
          NATIVE_SUFFIX: ${{ matrix.suffix }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 # Never replace original payloads on release-only retries.
          test ! -e "$CARGO_TARGET_DIR"
          if [[ "$RUNNER_OS" == macOS ]]; then export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"; fi
          if [[ "$NATIVE_SUFFIX" == win32-arm64-msvc ]]; then node -e "require('node:assert/strict').equal(process.arch,'arm64')"; fi
          flags=()
          if [[ "$RUNNER_OS" == Linux ]]; then flags+=(--zigbuild); fi
          node e2e/binding/package/provenance.mjs "$NATIVE_TARGET" "$RUNNER_TEMP/native-build-$NATIVE_SUFFIX/payload" "$GITHUB_RUN_ID/1" "${flags[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-build-${{ matrix.suffix }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-build-${{ matrix.suffix }}/*
          if-no-files-found: error
          retention-days: 7

  native-packs:
    needs: [native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Start durable collector evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-pack-evidence"
          printf '%s\n' "$GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $RUNNER_OS $RUNNER_ARCH $ImageOS $ImageVersion" > "$RUNNER_TEMP/native-pack-evidence/runner.txt"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v8
        with:
          pattern: native-build-*-${{ github.run_id }}
          path: ${{ runner.temp }}/native-inputs
      - name: Collect once from clean source and run real-artifact controls
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          mkdir "$RUNNER_TEMP/native-artifacts"
          for suffix in $(node --input-type=module -e "import {targets} from './e2e/binding/package/matrix.mjs'; console.log(targets.map(r=>r.suffix).join(' '))"); do
            mv "$RUNNER_TEMP/native-inputs/native-build-$suffix-$GITHUB_RUN_ID/payload" "$RUNNER_TEMP/native-artifacts/$suffix"
          done
          mkdir -p bindings/devup-ui-binding/pkg
          node bindings/devup-ui-binding/script.cjs --public "$PWD/bindings/devup-ui-binding/pkg/index.cjs"
          node e2e/binding/package/collect.mjs "$RUNNER_TEMP/native-artifacts" "$RUNNER_TEMP/native-bundle" "$GITHUB_RUN_ID/1"
          mkdir "$RUNNER_TEMP/native-controls"
          cp -R "$RUNNER_TEMP/native-artifacts/linux-x64-gnu" "$RUNNER_TEMP/native-controls/linux-x64-gnu"
          NATIVE_PROOF_ARTIFACTS="$RUNNER_TEMP/native-controls" NATIVE_PROOF_BUNDLE="$RUNNER_TEMP/native-bundle" node --test e2e/binding/package/package.test.mjs e2e/binding/package/publish.test.mjs e2e/binding/package/elf.test.mjs
          sha256sum "$RUNNER_TEMP/native-bundle/"*.tgz "$RUNNER_TEMP/native-bundle/bundle.json" | tee "$RUNNER_TEMP/native-bundle/SHA256SUMS"
          du -b "$RUNNER_TEMP/native-bundle/"*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-packs-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bundle/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-pack-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/native-pack-evidence/*
          if-no-files-found: error
          retention-days: 7

  native-consumer:
    needs: [native-packs]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: linux-x64-gnu, runner: ubuntu-latest, cpu: x64, docker: amd64, image: "node:current", bun: bun-linux-x64.zip, mode: native-container }
          - { suffix: linux-arm64-gnu, runner: ubuntu-latest, cpu: arm64, docker: arm64, image: "node:current", bun: bun-linux-aarch64.zip, mode: QEMU-emulated }
          - { suffix: linux-x64-musl, runner: ubuntu-latest, cpu: x64, docker: amd64, image: "node:current-alpine", bun: bun-linux-x64-musl.zip, mode: native-container }
          - { suffix: linux-arm64-musl, runner: ubuntu-latest, cpu: arm64, docker: arm64, image: "node:current-alpine", bun: bun-linux-aarch64-musl.zip, mode: QEMU-emulated }
          - { suffix: darwin-x64, runner: macos-latest, cpu: x64, bun: bun-darwin-x64.zip, mode: Rosetta }
          - { suffix: darwin-arm64, runner: macos-latest, cpu: arm64, bun: bun-darwin-aarch64.zip, mode: native }
          - { suffix: win32-x64-msvc, runner: windows-latest, cpu: x64, bun: bun-windows-x64.zip, mode: native }
          # Windows ARM has no -latest alias; this is its newest exposed image, not a pin.
          - { suffix: win32-arm64-msvc, runner: windows-11-vs2026-arm, cpu: arm64, bun: bun-windows-aarch64.zip, mode: native }
    env:
      NATIVE_SUFFIX: ${{ matrix.suffix }}
      NATIVE_CPU: ${{ matrix.cpu }}
      NATIVE_MODE: ${{ matrix.mode }}
    steps:
      - name: Start durable consumer evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          printf '%s\n' "$NATIVE_MODE $GITHUB_SHA $RUNNER_OS $RUNNER_ARCH" > "$RUNNER_TEMP/native-evidence/start.txt"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: native-packs-${{ github.run_id }}
          path: ${{ runner.temp }}/native-bundle
      - name: Enable current ARM emulation
        if: runner.os == 'Linux' && matrix.cpu == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Enable Rosetta for both x64 runtimes
        if: matrix.mode == 'Rosetta'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
          architecture: ${{ runner.os == 'Linux' && 'x64' || matrix.cpu }}
      - name: Download matching latest official Bun with digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUN_ASSET: ${{ matrix.bun }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-tools"
          gh api repos/oven-sh/bun/releases/latest > "$RUNNER_TEMP/native-evidence/bun-release.json"
          node -e "const fs=require('node:fs'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/native-evidence/bun-release.json'));const a=r.assets.find(a=>a.name===process.env.BUN_ASSET);if(!a?.digest?.startsWith('sha256:'))throw Error('missing official digest');fs.writeFileSync(process.env.RUNNER_TEMP+'/native-evidence/bun-asset.json',JSON.stringify(a))"
          url=$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP+'/native-evidence/bun-asset.json')).browser_download_url")
          curl -fsSL "$url" -o "$RUNNER_TEMP/native-tools/bun.zip"
          node -e "const fs=require('node:fs'),c=require('node:crypto'),p=process.env.RUNNER_TEMP;require('node:assert/strict').equal('sha256:'+c.createHash('sha256').update(fs.readFileSync(p+'/native-tools/bun.zip')).digest('hex'),JSON.parse(fs.readFileSync(p+'/native-evidence/bun-asset.json')).digest)"
          unzip -q "$RUNNER_TEMP/native-tools/bun.zip" -d "$RUNNER_TEMP/native-tools"
          bun_dir="$RUNNER_TEMP/native-tools/${BUN_ASSET%.zip}"
          echo "$bun_dir" >> "$GITHUB_PATH"
          printf '%s\n' "$NATIVE_MODE" > "$RUNNER_TEMP/native-evidence/execution-mode.txt"
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/native-evidence/runner.json',JSON.stringify(Object.fromEntries(['GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_OS','RUNNER_ARCH','ImageOS','ImageVersion','NATIVE_MODE','NATIVE_SUFFIX'].map(k=>[k,process.env[k]]))))"
      - name: Consume on matching macOS or Windows runtimes
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          node --input-type=module <<'NODE' 2>&1 | tee "$RUNNER_TEMP/native-evidence/consumer.log"
          import assert from 'node:assert/strict'
          import { dirname, join } from 'node:path'
          import { realpathSync } from 'node:fs'
          import getExePath from './node_modules/@typescript/native/lib/getExePath.js'
          import { command } from './e2e/binding/package/provenance.mjs'
          import { consume } from './e2e/binding/package/consumer.mjs'
          assert.equal(process.arch, process.env.NATIVE_CPU)
          assert.equal(command('bun', ['-p', 'process.arch']), process.env.NATIVE_CPU)
          const tsc = getExePath()
          console.log({ mode: process.env.NATIVE_MODE, tsc, version: command(tsc, ['--version']) })
          const npmCli = process.platform === 'win32' ? join(dirname(process.execPath), 'node_modules/npm/bin/npm-cli.js') : realpathSync(command('which', ['npm']))
          await consume({ bundle: join(process.env.RUNNER_TEMP, 'native-bundle'), suffix: process.env.NATIVE_SUFFIX, report: join(process.env.RUNNER_TEMP, 'native-evidence/consumer.json'), tsc, npmCli })
          NODE
      - name: Consume current GNU or musl container with matching Node and Bun
        if: runner.os == 'Linux'
        shell: bash
        env:
          CONTAINER_IMAGE: ${{ matrix.image }}
          CONTAINER_CPU: ${{ matrix.docker }}
          BUN_ASSET: ${{ matrix.bun }}
        run: |
          set -euo pipefail
          docker pull --platform "linux/$CONTAINER_CPU" "$CONTAINER_IMAGE"
          docker image inspect "$CONTAINER_IMAGE" > "$RUNNER_TEMP/native-evidence/container.json"
          docker run --rm -i --platform "linux/$CONTAINER_CPU" -v "$PWD:/repo" -v "$RUNNER_TEMP:/evidence" -w /repo -e NATIVE_SUFFIX -e NATIVE_CPU -e NATIVE_MODE -e BUN_ASSET "$CONTAINER_IMAGE" sh -eu <<'SH' 2>&1 | tee "$RUNNER_TEMP/native-evidence/consumer.log"
          if command -v apk >/dev/null; then apk add --no-cache libstdc++ tar; else apt-get update && apt-get install -y --no-install-recommends libatomic1; fi
          export PATH="/evidence/native-tools/${BUN_ASSET%.zip}:$PATH"
          bun install --frozen-lockfile --ignore-scripts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { realpathSync } from 'node:fs'
          import getExePath from './node_modules/@typescript/native/lib/getExePath.js'
          import { command } from './e2e/binding/package/provenance.mjs'
          import { consume } from './e2e/binding/package/consumer.mjs'
          assert.equal(process.arch, process.env.NATIVE_CPU)
          assert.equal(command('bun', ['-p', 'process.arch']), process.env.NATIVE_CPU)
          const tsc = getExePath()
          console.log({ mode: process.env.NATIVE_MODE, tsc, version: command(tsc, ['--version']) })
          await consume({ bundle: '/evidence/native-bundle', suffix: process.env.NATIVE_SUFFIX, report: '/evidence/native-evidence/consumer.json', tsc, npmCli: realpathSync(command('which', ['npm'])) })
          NODE
          SH
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-consumer-${{ matrix.suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/*
          if-no-files-found: error
          retention-days: 7

  # Builds every package once, exactly as `bun run build` does, and hands the
  # outputs (the WASM package, the host native addon and every dist directory)
  # to the jobs below as the `package-build` artifact, so they test this build
  # instead of compiling the same Rust and TypeScript again. Only the jobs that
  # check a build of their own (native-build, release-compat, release) build.
  #
  # Caches are restored on every run but saved only by pushes to main: pull
  # request caches can only be read by the same pull request, and saving them
  # evicted main's, so every pull request started cold.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - &record-runner-image
        name: Record the runner image for cache keys
        shell: bash
        # ImageOS names the OS release of the hosted image (ubuntu24, ...),
        # which changes when `ubuntu-latest` moves to a new Ubuntu release.
        run: echo "RUNNER_IMAGE=${ImageOS:?ImageOS is not set}" >> "$GITHUB_ENV"

      - &setup-rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        id: rust
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-save-if: ${{ github.event_name == 'push' }}

      - &install-wasm-pack
        name: Install and verify latest stable wasm-pack
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The latest cargo-binstall release binary, checked against the
          # SHA-256 digest GitHub records for the release asset, instead of
          # piping the installer script from the repository's main branch.
          test "$RUNNER_OS-$RUNNER_ARCH" = Linux-X64
          asset=cargo-binstall-x86_64-unknown-linux-musl.tgz
          gh api repos/cargo-bins/cargo-binstall/releases/latest > "$RUNNER_TEMP/cargo-binstall-release.json"
          url="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/cargo-binstall-release.json")"
          digest="$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .digest | select(type == "string" and startswith("sha256:"))' "$RUNNER_TEMP/cargo-binstall-release.json")"
          curl -fsSL --proto '=https' --tlsv1.2 "$url" -o "$RUNNER_TEMP/$asset"
          echo "${digest#sha256:}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "${CARGO_HOME:-$HOME/.cargo}/bin" cargo-binstall
          echo "Installed $(jq -r .tag_name "$RUNNER_TEMP/cargo-binstall-release.json") of cargo-binstall"
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          cargo binstall wasm-pack --no-confirm --force
          latest="$(curl -fsSL -A 'devup-ui CI (https://github.com/dev-five-git/devup-ui)' https://crates.io/api/v1/crates/wasm-pack | jq -er '.crate.max_stable_version | select(type == "string" and length > 0)')"
          installed="$(wasm-pack --version)"
          echo "Installed $installed; crates.io latest stable: $latest"
          test "$installed" = "wasm-pack $latest"

      - &setup-bun
        uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: latest
        name: Install bun
      # One bun cache for every job: they all install the same lockfile.
      - &restore-bun-cache
        name: Restore bun dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-bun-${{ steps.bun.outputs.bun-version }}-

      - &setup-node
        name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # `latest` can select alphas from https://nodejs.org/dist/index.json;
          # see https://github.com/actions/setup-node/issues/1657.
          # The stable manifest can briefly trail nodejs.org after a stable release.
          node-version: '*'
          check-latest: true
      - run: bun install --frozen-lockfile
      - name: Run bun run build
        shell: bash
        run: |
          set -euo pipefail
          # The commands of `bun run build`, read from package.json, except
          # that its first command (the host native addon, built with two
          # Cargo jobs) runs while the rest compiles the WASM package in a
          # separate target directory, so the two Rust builds overlap.
          script="$(node -p "require('./package.json').scripts.build")"
          native="${script%% && *}"
          rest="${script#* && }"
          test "$native" = "node e2e/binding/package/build-host.mjs"
          (node e2e/binding/package/build-host.mjs 2>&1 | sed -u 's/^/[native] /') &
          native_pid=$!
          CARGO_TARGET_DIR="$PWD/target/wasm" bash -euo pipefail -c "$rest"
          wait "$native_pid"
      - name: Pack the build outputs
        shell: bash
        run: |
          set -euo pipefail
          # Every file the build created: untracked, outside node_modules and
          # the Cargo target directory.
          git ls-files -z --others -- ':(exclude,glob)**/node_modules/**' ':(exclude,glob)target/**' > "$RUNNER_TEMP/build-files"
          tr '\0' '\n' < "$RUNNER_TEMP/build-files"
          tar --null -T "$RUNNER_TEMP/build-files" -czf "$RUNNER_TEMP/package-build.tgz"
          du -h "$RUNNER_TEMP/package-build.tgz"
          test -s bindings/devup-ui-wasm/pkg/index_bg.wasm
          test -s bindings/devup-ui-binding/pkg/index.cjs
          test -s bindings/devup-ui-binding-linux-x64-gnu/binding.linux-x64-gnu.node
      - uses: actions/upload-artifact@v7
        with:
          name: package-build
          path: ${{ runner.temp }}/package-build.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Save bun dependencies
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

  # Formatting, Clippy and ESLint, the checks of the built packages, and the
  # changepacks of a pull request.
  lint:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # changepacks diffs HEAD against the previous release commit. The
          # default shallow fetch grafts away every parent, so that lookup dies
          # with "Could not find a merge-base".
          fetch-depth: 0
          fetch-tags: true
      - *record-runner-image
      - *setup-rust
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - &download-build
        name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: package-build
          path: ${{ runner.temp }}/package-build
      - &unpack-build
        name: Unpack the build
        run: tar -xzf "$RUNNER_TEMP/package-build/package-build.tgz"
      - name: Verify built package entry points
        run: bun run verify:dist
      - name: Verify the README benchmark tables
        run: bun render-benchmark-readme.js --check
      - name: Verify publish tarballs
        shell: bash
        run: |
          set -euo pipefail
          for manifest in bindings/*/package.json packages/*/package.json; do
            # Exactly the nine native names delegate to native-packs/consumer.
            name=$(node -p "require('./$manifest').name")
            case "$name" in
              @devup-ui/binding|@devup-ui/binding-linux-x64-gnu|@devup-ui/binding-linux-arm64-gnu|@devup-ui/binding-linux-x64-musl|@devup-ui/binding-linux-arm64-musl|@devup-ui/binding-darwin-x64|@devup-ui/binding-darwin-arm64|@devup-ui/binding-win32-x64-msvc|@devup-ui/binding-win32-arm64-msvc) continue ;;
            esac
            package_dir="$(dirname "$manifest")"
            pack_dir="$RUNNER_TEMP/publish-verify/${package_dir//\//-}"
            mkdir -p "$pack_dir"
            (cd "$package_dir" && bun pm pack --quiet --destination "$pack_dir")
            tarballs=("$pack_dir"/*.tgz)
            if [[ "${#tarballs[@]}" -ne 1 ]]; then
              echo "Expected one tarball for $package_dir" >&2
              exit 1
            fi
            packed_manifest="$(tar -xOf "${tarballs[0]}" package/package.json)"
            if grep -q 'workspace:' <<< "$packed_manifest"; then
              echo "Unresolved workspace dependency in $package_dir" >&2
              exit 1
            fi
          done
      - run: bun run lint
      - name: Check the changepacks of this change
        if: github.event_name == 'pull_request'
        run: |
          # changepacks compares the change against a local main, which a pull request checkout does not have
          git fetch --no-tags origin main:refs/heads/main
          bunx @changepacks/cli@latest check --format json

  # The first half of `bun run test`: Rust coverage with cargo-tarpaulin,
  # including the native addon, held at 100%. It needs no package build.
  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-rust
      - *install-wasm-pack
      - name: Install cargo-tarpaulin
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo binstall cargo-tarpaulin --no-confirm --force
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - name: Format the Rust sources for coverage
        run: |
          # rust coverage issue
          echo 'max_width = 100000' > .rustfmt.toml
          echo 'tab_spaces = 4' >> .rustfmt.toml
          echo 'newline_style = "Unix"' >> .rustfmt.toml
          echo 'fn_call_width = 100000' >> .rustfmt.toml
          echo 'fn_params_layout = "Compressed"' >> .rustfmt.toml
          echo 'chain_width = 100000' >> .rustfmt.toml
          echo 'merge_derives = true' >> .rustfmt.toml
          echo 'use_small_heuristics = "Default"' >> .rustfmt.toml
          cargo fmt
      # cargo-tarpaulin 0.37.6 misreads the coverage rustc 1.100 records: it
      # reports the first line of match arms, impls and macros whose bodies
      # run as uncovered. The coverage run stays on 1.99.1 until it reads the
      # new release; every other job builds, lints and tests on latest stable.
      - name: Install the Rust release coverage is measured with
        run: rustup toolchain install 1.99.1 --profile minimal
      # `bun run test` is this command followed by `bun run test:bun`, which
      # the bun-tests job runs.
      - name: Rust coverage
        run: node e2e/binding/native-coverage/run.mjs
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
      - name: Format Rollback
        run: |
          rm -rf .rustfmt.toml
          # Formatting with the temporary coverage config and then with the
          # default config is not a reversible round trip. Restore the exact
          # checked-in sources so the checkout is clean again.
          git restore --source=HEAD --staged --worktree -- .
          cargo fmt --all -- --check
          git diff --exit-code
      - name: Upload the Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: |
            cobertura.xml
            target/tarpaulin/coverage.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The second half of `bun run test`: every Bun suite with its 100% coverage
  # thresholds, then the bun-plugin preload race regression.
  bun-tests:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - *download-build
      - *unpack-build
      - run: bun run test:bun
      - name: Regression test (bun-plugin preload race)
        run: bun run --filter @devup-ui/bun-plugin test:regression
      - name: Upload the Bun coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-bun
          path: |
            coverage/root/lcov.info
            coverage/vite/lcov.info
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Rust coverage excludes every wasm-bindgen wrapper, so the WASM ABI is
  # checked here instead: the public corpus must match the native addon
  # byte for byte, every invalid argument shape must be rejected, and the
  # step summary reports which exports and positions were reached.
  wasm-abi:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - *download-build
      - *unpack-build
      - name: WASM ABI coverage
        run: bun run test:wasm-abi

  # The landing app against the deployed vinext/@devup-ui/vite-plugin build.
  # The e2e builds render the frozen e2e/fixtures/benchmark-results.json, so
  # a benchmark refresh on main never changes a screenshot.
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - *download-build
      - *unpack-build
      - &build-storybook
        name: Build Storybook
        run: |
          bun run --filter @devup-ui/components build-storybook
          mv ./packages/components/storybook-static ./apps/landing/public/storybook
      - name: Build Landing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANDING_BENCHMARK_DATA: fixture
        run: bun run --filter landing build
      - &record-playwright-revisions
        name: Record the Playwright browser revisions for cache keys
        shell: bash
        # The browser builds the installed Playwright downloads, such as
        # chromium-1243_firefox-1543_..., read from its install locations.
        run: |
          revisions="$(bunx playwright install --dry-run | sed -n 's|.*Install location: *.*/||p' | sort | paste -sd_ -)"
          test -n "$revisions"
          echo "PLAYWRIGHT_REVISIONS=$revisions" >> "$GITHUB_ENV"
      # One Chromium cache for every job that installs only Chromium.
      - &restore-playwright-cache
        name: Restore Playwright Browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}
      # Each attempt is time-limited and retried, so a stalled apt mirror or
      # browser download costs minutes instead of the whole job.
      - &install-chromium
        name: Install Playwright Browsers
        timeout-minutes: 14
        env:
          ATTEMPT_TIMEOUT: 3m
        run: bash .github/scripts/install-playwright.sh chromium
      # A run only compares against the screenshots checked into the repository:
      # it never creates or commits them. A new visual test needs its baselines
      # generated by a maintainer (`bun run test:e2e:update`) and committed.
      - &require-e2e-baselines
        name: Require the E2E baselines
        run: |
          SNAPSHOT_COUNT=$(find e2e -name '*-linux.png' -path '*-snapshots/*' 2>/dev/null | wc -l)
          echo "Found $SNAPSHOT_COUNT linux baseline snapshot(s)"
          if [ "$SNAPSHOT_COUNT" -eq 0 ]; then
            echo "No checked-in baselines under e2e/**/*-snapshots; generate them with 'bun run test:e2e:update' and commit them." >&2
            exit 1
          fi
      - name: Run E2E Tests
        run: bun run test:e2e
      - name: Run Landing dev navigation tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx playwright test -c playwright.landing-dev.config.ts
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1
      - name: Save Playwright Browsers
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}

  # The same suite against the singleCss build. On a push to main this job
  # also builds the site with the live benchmark numbers and uploads it for
  # `deploy-pages`, which runs only after `publish` passed.
  e2e-single-css:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - *download-build
      - *unpack-build
      - *build-storybook
      - name: Build Landing (singleCss)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANDING_BENCHMARK_DATA: fixture
        run: DEVUP_SINGLE_CSS=1 bun run --filter landing build
      - *record-playwright-revisions
      - *restore-playwright-cache
      - *install-chromium
      - *require-e2e-baselines
      - name: Run E2E Tests (singleCss)
        run: bun run test:e2e
      - name: Upload singleCss Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-singlecss
          path: playwright-report/
          retention-days: 1
      # The same singleCss build as above, with the live benchmark numbers.
      - name: Build Landing for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf apps/landing/dist apps/landing/.next apps/landing/.vinext apps/landing/df
          DEVUP_SINGLE_CSS=1 bun run --filter landing build
          grep -q 'data-benchmark-source="live"' apps/landing/dist/client/index.html
      - name: Upload the site for deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/landing/dist/client
          retention-days: 1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  benchmark:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      - *download-build
      - *unpack-build
      # Every row is the median of the same number of cold samples taken in
      # rotating order (benchmark-manifest.json). The run goes to an artifact and
      # the Devup UI rows are compared with the checked baseline at the end of the
      # job, so the profile still runs when it fails.
      - name: Benchmark
        run: bun run benchmark
      - name: Profile Devup UI Turbopack
        env:
          DEVUP_UI_PROFILE: "1"
        run: |
          rm -rf benchmark/next-devup-ui-single-turbo/.next \
            benchmark/next-devup-ui-single-turbo/df \
            benchmark/next-devup-ui-single-turbo/tsconfig.tsbuildinfo
          bun run --filter next-devup-ui-single-turbo-benchmark build
      - name: Upload the measured run
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: benchmark-run
          path: benchmark-run.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Compare the Devup UI rows with the baseline
        run: bun benchmark-check.js

  # The Rust half of the benchmark, on its own runner so it neither waits for
  # the package build nor shares a machine with the measured builds.
  benchmark-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-rust
      - name: Measure the SemanticBuilder passes of the extractor
        run: cargo bench -p extractor --bench semantic_pass_benchmark -- --quick

  # The landing app is the only real-scale acceptance target in this repo, and
  # `e2e` runs it against the deployed vinext/@devup-ui/vite-plugin build.
  # This job runs the SAME 128 assertions and the SAME screenshot baselines
  # against a Next 16 + Turbopack build, so @devup-ui/next-plugin's production
  # CSS path stays gated at 64 routes - the scale where extraction-wave races
  # actually reproduce. `landing-next-e2e-single-css` runs the singleCss build.
  # Neither artifact is ever deployed.
  landing-next-e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Render the frozen e2e/fixtures/benchmark-results.json, so a benchmark
      # refresh on main never changes a screenshot. This build is never deployed.
      LANDING_BENCHMARK_DATA: fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      - *download-build
      - *unpack-build
      - *build-storybook
      - name: Build Landing (Next)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run --filter landing build:next
      - *record-playwright-revisions
      - *restore-playwright-cache
      - *install-chromium
      - name: Run E2E Tests (Next)
        run: bun run test:e2e:next
      - name: Run Landing dev navigation tests (Next)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANDING_BUILD_MODE: next
        run: bunx playwright test -c playwright.landing-dev.config.ts
      - name: Upload Next Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-next-per-file
          path: playwright-report/
          retention-days: 1

  landing-next-e2e-single-css:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LANDING_BENCHMARK_DATA: fixture
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      - *download-build
      - *unpack-build
      - *build-storybook
      - name: Build Landing (Next, singleCss)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: DEVUP_SINGLE_CSS=1 bun run --filter landing build:next
      - *record-playwright-revisions
      - *restore-playwright-cache
      - *install-chromium
      - name: Run E2E Tests (Next, singleCss)
        run: bun run test:e2e:next
      - name: Upload Next Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-next
          path: playwright-report/
          retention-days: 1

  # The packages take React ^18 || ^19 as a peer. This builds a React 18.3 app
  # with the Vite plugin and the UI kit, then checks refs, context and events
  # in Chromium, so React-19-only APIs cannot slip back in.
  react-18:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      - *download-build
      - *unpack-build
      - name: Type-check and build the React 18 app
        working-directory: apps/react-18
        run: |
          bun ../../node_modules/@typescript/native/bin/tsc
          bun run build
      - *record-playwright-revisions
      - *restore-playwright-cache
      - *install-chromium
      - name: Run React 18 E2E Tests
        working-directory: apps/react-18
        run: bun run test:e2e

  # Whether this change touches React Native: the extractor's native output,
  # the engines, the Metro plugin and its utilities, the Expo app or this
  # workflow. The Expo job below runs only then.
  native-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the base
        id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; running the Expo job."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$(git merge-base "$BASE" HEAD)" HEAD)"
          echo "$files"
          if grep -qE '^(libs/extractor/src/native/|libs/binding/|bindings/devup-ui-(binding|wasm)/|packages/(metro-plugin|plugin-utils)/|packages/react/src/native/|apps/expo/|\.github/workflows/publish\.yml$)' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The Expo example app (apps/expo) bundled for iOS and Android through
  # @devup-ui/metro-plugin, as a release build does. Devup UI compiles away,
  # so no bundle may keep a module of @devup-ui/react but its React Native
  # runtime (`@devup-ui/react/native`), nor its runtime placeholder, and a
  # file styled the same in every theme must not use that runtime.
  expo:
    needs: [build, native-changes]
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install --frozen-lockfile
      - *download-build
      - *unpack-build
      - name: Export the iOS and Android bundles
        working-directory: apps/expo
        env:
          EXPO_NO_TELEMETRY: '1'
        run: bun run export
      - name: Check the bundles
        working-directory: apps/expo
        run: bun run check

  # @devup-ui/vite-plugin must keep the CSS every server page needs when the
  # build is vinext/RSC. The fixture shares one Devup UI header between server
  # list pages and a client page, and the tests read the styles the browser
  # actually applies when each route is entered directly, so a dropped
  # stylesheet dependency fails here whatever the CSS files are called.
  vinext-rsc-css-e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      - *download-build
      - *unpack-build
      - *record-playwright-revisions
      - *restore-playwright-cache
      - *install-chromium
      - name: Build fixture (per-file CSS)
        run: bun run --filter vinext-rsc-css-repro build
      - name: Run E2E Tests (per-file CSS)
        run: bun run test:e2e:rsc-css
      - name: Build fixture (singleCss)
        run: |
          rm -rf apps/vinext-rsc-css-repro/dist apps/vinext-rsc-css-repro/.vinext apps/vinext-rsc-css-repro/df
          DEVUP_SINGLE_CSS=1 bun run --filter vinext-rsc-css-repro build
      - name: Run E2E Tests (singleCss)
        run: bun run test:e2e:rsc-css

  # Builds the packages itself: the build under the memory watchdog is the
  # check, so it cannot reuse the `build` job's outputs.
  release-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-rust
      - *setup-bun
      - *restore-bun-cache
      - *install-wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
      - run: bun install
      - name: Test exited-process memory sampling
        run: node --test e2e/release/process-memory.test.mjs
      - name: Build packages under the memory watchdog
        run: node e2e/release/build-packages.mjs
      - *record-playwright-revisions
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-release-compat-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}
      # Firefox and WebKit need about 140 MB of Ubuntu packages the image does
      # not ship. Keeping the .deb files between runs spares the runner's
      # Ubuntu mirror, which has served them slowly enough to time the job out.
      - name: Record the week for the apt package cache key
        run: echo "CACHE_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      - name: Restore Playwright system packages
        id: restore-playwright-apt
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-release-compat-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}-${{ env.CACHE_WEEK }}
          restore-keys: |
            playwright-apt-release-compat-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-
      - name: Install Playwright browsers
        timeout-minutes: 14
        env:
          ATTEMPT_TIMEOUT: 4m
          PLAYWRIGHT_APT_CACHE: ~/.cache/playwright-apt
        run: bash .github/scripts/install-playwright.sh chromium firefox webkit
      - name: Save Playwright system packages
        if: steps.restore-playwright-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-release-compat-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}-${{ env.CACHE_WEEK }}
      - name: Build packed consumers and check production computed styles
        run: bun run test:release
      - name: Upload release compatibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-compat-results
          path: |
            release-package-build.json
            release-results.json
          if-no-files-found: error
          retention-days: 30
      - name: Save Playwright browsers
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-release-compat-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_REVISIONS }}

  webpack-extends-theme:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Configure isolated paths
        run: |
          printf 'DEVUP_PLAYWRIGHT_ROOT=%s/webpack-extends-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/webpack-extends-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DEVUP_EXTENDS_RESULTS=%s/webpack-extends-results\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
      - *record-runner-image
      - *setup-bun
      - *restore-bun-cache
      - *setup-node
      - run: bun install
      # The `build` job's fresh WASM and packages of this commit.
      - *download-build
      - *unpack-build
      - name: Install latest private Playwright
        run: |
          mkdir -p "$DEVUP_PLAYWRIGHT_ROOT" "$DEVUP_EXTENDS_RESULTS"
          printf '{"private":true,"type":"module"}\n' > "$DEVUP_PLAYWRIGHT_ROOT/package.json"
          bun add --cwd "$DEVUP_PLAYWRIGHT_ROOT" @playwright/test@latest
      - name: Install Chromium for the private Playwright
        timeout-minutes: 14
        env:
          ATTEMPT_TIMEOUT: 4m
        run: |
          PLAYWRIGHT_CLI="node $DEVUP_PLAYWRIGHT_ROOT/node_modules/@playwright/test/cli.js" \
            bash .github/scripts/install-playwright.sh chromium
      - name: Installed formats and production theme delivery regressions
        run: |
          set -euo pipefail
          env -u CI node --test packages/webpack-plugin/src/__tests__/extends-theme/extends-theme-regression.mjs 2>&1 | tee "$DEVUP_EXTENDS_RESULTS/matrix.log"
      - name: Upload packed-consumer matrix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webpack-extends-theme-evidence
          path: |
            ${{ runner.temp }}/webpack-extends-results/matrix.log
            ${{ runner.temp }}/webpack-extends-results/extends-theme-*/*.json
            ${{ runner.temp }}/webpack-extends-results/extends-theme-*/*/identity-*.json
            ${{ runner.temp }}/webpack-extends-results/extends-theme-*/*/bun.lock
            ${{ runner.temp }}/webpack-extends-results/extends-theme-*/packs/*/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Validation summary: runs on pull requests and on pushes to main, read-only.
  # The job id stays `publish` because it is the status check the repository
  # requires, and it passes only when every validation job above passed (a
  # skipped job would otherwise count as passing). It uploads the Rust and Bun
  # coverage together. The privileged release steps live in `release` and
  # `deploy-pages` below.
  publish:
    needs: [build, lint, rust-coverage, bun-tests, wasm-abi, e2e, e2e-single-css]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the Rust coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-rust
          path: .
      - name: Download the Bun coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-bun
          path: coverage
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage/root/lcov.info,./coverage/vite/lcov.info

  # Pages deployment: the only job with `pages` and `id-token` write, and it
  # only runs for a push to main whose validation passed.
  deploy-pages:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v5

  # Publishes through npm OIDC trusted publishing. The job's `id-token: write`
  # permission lets npm exchange GitHub's short-lived OIDC token, and public
  # packages receive provenance automatically.
  #
  # PREREQUISITE: every @devup-ui/* package must be registered as a Trusted
  # Publisher on npmjs.com against repo dev-five-git/devup-ui and workflow
  # file `publish.yml`. npm matches that filename exactly, so renaming or
  # moving this file breaks publishing until the entries are updated.
  #
  # The publish command itself is selected in .changepacks/config.json.
  # Bun packs each workspace so dependency ranges are materialized, then
  # npm publishes that tarball with OIDC (Bun cannot do OIDC itself:
  # oven-sh/bun#22423).
  #
  # It runs only for a push to main whose validation and end-to-end jobs
  # passed, and is the only job that can write contents, open pull requests or
  # mint an OIDC token for npm.
  release:
    needs: [publish, landing-next-e2e, landing-next-e2e-single-css, react-18, release-compat, native-consumer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # changepacks diffs HEAD against the previous release commit. The
          # default shallow fetch grafts away every parent, so that lookup dies
          # with "Could not find a merge-base" and the release never publishes.
          fetch-depth: 0
          fetch-tags: true
      - *record-runner-image

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: latest
        name: Install bun

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        id: rust
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-release-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-rustc-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-release-${{ runner.os }}-${{ env.RUNNER_IMAGE }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}

      - *install-wasm-pack
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: '*'
          check-latest: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify built package entry points
        run: bun run verify:dist
      - name: Verify clean publish checkout
        run: git diff --exit-code
      # Stable artifact name deliberately survives a release-only run_attempt retry.
      - uses: actions/download-artifact@v8
        with:
          name: native-packs-${{ github.run_id }}
          path: ${{ runner.temp }}/native-release-bundle
      - uses: changepacks/action@main
        id: changepacks
        env:
          NATIVE_RELEASE_BUNDLE: ${{ runner.temp }}/native-release-bundle
        with:
          publish: true

  # Publishes the numbers `benchmark` measured on a push to main: rewrites
  # benchmark-results.json (the README sections and the landing page read it),
  # appends the run to benchmark/history.json, and pushes that as one commit to
  # main, so every merge leaves its numbers next to it and a slower build can be
  # traced to the merge that caused it (`bun benchmark-refresh.js --trend <row>`).
  #
  # It cannot release or loop: it waits for `release` to finish so it never
  # races changepacks, it runs no build, publish or changepacks step, and the
  # commit it pushes is made with GITHUB_TOKEN (whose pushes start no workflow)
  # and carries [skip ci]. It records a failed gate too, so the regression is in
  # the history, and skips a run whose artifact is missing.
  #
  # A commit older than the published results is only added to the history
  # (benchmark-refresh.js checks the ancestry). If main moves during the job it
  # rebuilds the commit on the new HEAD; if pushing to main keeps failing (for
  # example once a ruleset protects main without a bypass for GitHub Actions),
  # it pushes the commit to `chore/benchmark-refresh` and keeps one pull request
  # open for it instead.
  benchmark-refresh:
    needs: [benchmark, release]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.benchmark.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: benchmark-refresh-main
      cancel-in-progress: false
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download the measured run
        id: measured
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-run
          path: ${{ runner.temp }}/benchmark-run
      - name: Checkout main
        if: steps.measured.outcome == 'success'
        uses: actions/checkout@v7
        with:
          ref: main
          # benchmark-refresh.js compares commits and reads their baselines
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        if: steps.measured.outcome == 'success'
        with:
          bun-version: latest
        name: Install bun
      - name: Record the run and push it to main
        if: steps.measured.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED: ${{ runner.temp }}/benchmark-run/benchmark-run.json
          MESSAGE: "chore(benchmark): record run ${{ github.run_id }} of ${{ github.sha }} [skip ci]"
          BRANCH: chore/benchmark-refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The scripts need no dependencies; only the files they write are staged.
          record() {
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$MEASURED" benchmark-run.json
            bun benchmark-refresh.js
            bun render-benchmark-readme.js
            rm benchmark-run.json
            git add -- benchmark-results.json benchmark/history.json README.md README_ko.md 'packages/*/README.md'
          }

          for attempt in 1 2 3; do
            record
            if git diff --cached --quiet; then
              echo "Nothing to record for ${GITHUB_SHA}"
              exit 0
            fi
            git commit -q -m "$MESSAGE"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "Push to main failed (attempt ${attempt}); rebuilding on the new HEAD"
          done

          echo "::warning::Could not push the benchmark refresh to main; updating ${BRANCH} instead"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(benchmark): record the latest main benchmark' \
              --body 'Written by the `benchmark-refresh` job because it could not push to main. It carries the latest main run only; merging it publishes the numbers and its history entry.'
          fi
