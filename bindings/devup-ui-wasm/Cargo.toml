[package]
name = "devup-ui-wasm"
version = "0.1.0"
authors = ["owjs3901 <owjs3901@naver.com>"]
edition = "2024"
description = "Devup UI WASM bindings"
license = "Apache-2.0"
repository = "https://github.com/dev-five-git/devup-ui"
documentation = "https://devup-ui.com"
keywords = ["css", "wasm", "react", "devup-ui"]
categories = ["development-tools", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["vanilla-extract"]
vanilla-extract = ["extractor/vanilla-extract", "sheet/vanilla-extract"]

[dependencies]
wasm-bindgen = "0.2.127"
extractor = { path = "../../libs/extractor", default-features = false }
sheet = { path = "../../libs/sheet", default-features = false }
css = { path = "../../libs/css" }
rustc-hash = "2"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
bimap = { version = "0.6.3", features = ["serde"] }
js-sys = "0.3.104"
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
# Not used directly. Declared only to enable the `wasm_js` feature on the
# `getrandom` version that boa_engine pulls in (boa_engine -> rand 0.10 ->
# rand_core 0.10 -> getrandom 0.4), which `.cargo/config.toml`'s
# `getrandom_backend="wasm_js"` cfg requires on wasm32 targets.
# Keep this major version in sync with boa_engine's transitive getrandom.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.77"
serial_test = "4.0.1"
insta = "1.48.0"
rstest = "0.26.1"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# `sign-ext` is on by default for the wasm32 target in current rustc, so the
# emitted module carries `i32.extend8_s` and friends. wasm-opt validates against
# only the features listed here, so it has to be allowed explicitly. It is part
# of the WebAssembly 2.0 baseline (Chrome 74, Firefox 62, Safari 14.1, Node 12).
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
]
