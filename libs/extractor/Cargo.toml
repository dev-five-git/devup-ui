[package]
name = "extractor"
version = "0.1.0"
edition = "2024"
description = "Static style extraction engine for Devup UI"
license = "Apache-2.0"
repository = "https://github.com/dev-five-git/devup-ui"
keywords = ["css", "extractor", "jsx", "react", "devup-ui"]
categories = ["development-tools", "wasm", "web-programming"]

[lints]
workspace = true

[features]
default = ["vanilla-extract"]
vanilla-extract = ["dep:boa_engine"]

[dependencies]
oxc_parser = "0.147.0"
oxc_syntax = "0.147.0"
oxc_span = "0.147.0"
oxc_allocator = "0.147.0"
oxc_ast = "0.147.0"
oxc_ast_visit = "0.147.0"
oxc_codegen = "0.147.0"
oxc_transformer = "0.147.0"
oxc_semantic = "0.147.0"
css = { path = "../css" }
phf = "0.14"
strum = "0.28.0"
strum_macros = "0.28.0"
serde_json = "1.0"
boa_engine = { version = "0.22", optional = true }
rustc-hash = "2"
smallvec = "1"

[dev-dependencies]
insta = "1.48.0"
serial_test = "4.0.1"
rstest = "0.26.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "extract_benchmark"
harness = false

[[bench]]
name = "alloc_benchmark"
harness = false
