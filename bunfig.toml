[test]
root = "packages"
pathIgnorePatterns = ["**/vite-plugin/**"]
preload = ["./bun.preload.ts", "./bun.setup.ts", "bun-test-env-dom"]
# `bun run test` passes `--coverage`; enabling it here would hold focused `bun test <file>` runs to the full-suite threshold.
coverageReporter  = ["text", "lcov"] 
# Bun ignores unknown keys without a warning; packages/__tests__/coverage-threshold.test.ts checks this gate.
coverageThreshold = { lines = 1.0, functions = 1.0, statements = 1.0 }
coverageDir = "coverage/root"
coverageSkipTestFiles = true
# Generated artifacts are tested separately by the packed-consumer release gate.
coveragePathIgnorePatterns = ["**/pkg/**", "**/dist/**"]
