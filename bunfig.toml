[test]
root = "packages"
preload = ["./bun.setup.ts", "./packages/bun-plugin/src/index.ts", "bun-test-env-dom"]
coverage = true
coverageReporter  = ["text", "lcov"] 
coverageThreshold = { line = 1.0, function = 1.0, statement = 1.0 }
coverageSkipTestFiles = true
# Generated artifacts are tested separately by the packed-consumer release gate.
coveragePathIgnorePatterns = ["**/pkg/**", "**/dist/**"]
